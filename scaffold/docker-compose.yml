services:
  app:
    build: .
    depends_on: [postgres, minio]
    environment:
      DATABASE_URL: postgres://kaoming:${DB_PASSWORD}@postgres:5432/kaoming
      S3_ENDPOINT: http://minio:9000
      TZ: Asia/Taipei
    ports: ["3000:3000"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kaoming
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: kaoming
      TZ: Asia/Taipei
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backup:/backup
    ports: ["5432:5432"]
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET}
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on: [app]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddydata:/data
    ports: ["80:80", "443:443"]
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  caddydata:
