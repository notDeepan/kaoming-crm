# One command to move from laptop to the Houli server. Not used for local evaluation, which runs
# on SQLite with `npm run dev`. On the server, switch the datasource provider to postgresql and
# run `prisma migrate deploy` on first boot.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kmc
      POSTGRES_PASSWORD: kmc
      POSTGRES_DB: kmc
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmc"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://kmc:kmc@db:5432/kmc?schema=public"
      SESSION_SECRET: "change-me-in-production-a-long-random-32b+"
      STORAGE_ROOT: "/data/storage"
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      # Documents live outside the web root (DM-01 / SE-12), on a persistent volume.
      - doc-storage:/data/storage

volumes:
  db-data:
  doc-storage:
